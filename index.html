<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The portfolio of Olsa Domi — student, author, activist, and software engineer.">
    <meta name="theme-color" content="#050714">
    <link rel="stylesheet" href="style.css">
    <title>Olsa Domi — Portfolio</title>
</head>
<body>
    <div class="background" aria-hidden="true"></div>
    <div class="overlay" aria-hidden="true"></div>
    <div class="galaxy" aria-hidden="true"></div>

    <main class="universe" id="main-content">
        <header class="title">
            <p class="eyebrow">Welcome to my portfolio</p>
            <h1>Olsa Domi<span>Nation</span></h1>
            <p>Explore beyond my universe</p>
        </header>

        <nav class="planet-system" aria-label="Portfolio sections">
            <button id="planet-personal-details" class="planet" type="button" data-section="planet-personal-details"><span>Personal details</span></button>
            <button id="planet-education" class="planet" type="button" data-section="planet-education"><span>Education</span></button>
            <button id="planet-activism-volunteer" class="planet" type="button" data-section="planet-activism-volunteer"><span>Activism &amp; volunteer work</span></button>
            <button id="planet-publications" class="planet" type="button" data-section="planet-publications"><span>Publications</span></button>
            <button id="planet-tech-skills" class="planet" type="button" data-section="planet-tech-skills"><span>Tech skills</span></button>
            <button id="planet-interviews" class="planet" type="button" data-section="planet-interviews"><span>Interviews</span></button>
            <button id="planet-international-forums" class="planet" type="button" data-section="planet-international-forums"><span>International forums</span></button>
        </nav>
    </main>

    <section id="zoomed-content" class="zoomed-content hidden" role="dialog" aria-modal="true" aria-label="Portfolio section">
        <button class="close-btn" type="button" aria-label="Close section">Close <span aria-hidden="true">×</span></button>
        <div id="zoomed-details"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
